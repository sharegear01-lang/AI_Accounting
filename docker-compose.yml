services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_acct_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: ai_acct
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ai_acct"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
